name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build OpenMacro.slnx -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet format OpenMacro.slnx --verify-no-changes
